[Unit]
StartLimitIntervalSec=300
StartLimitBurst=10

[Service]
ExecStart=
ExecStart=/opt/yang-ai-gateway/.venv/bin/uvicorn app.conversation_protected_v2:app --host 127.0.0.1 --port 18000

StateDirectory=yang-ai-gateway
UMask=0077
MemoryHigh=512M
MemoryMax=768M
TasksMax=128
LimitNOFILE=4096
LogRateLimitIntervalSec=30s
LogRateLimitBurst=500

Environment=USAGE_DB_PATH=/var/lib/yang-ai-gateway/usage.db
Environment=MAX_SESSIONS_TOTAL=4
Environment=MAX_SESSIONS_PER_DEVICE=1
Environment=MAX_CONCURRENT_PIPELINES=2
Environment=TURNS_PER_MINUTE_PER_DEVICE=10
Environment=DAILY_TURNS_PER_DEVICE=200
Environment=DAILY_TURNS_TOTAL=300
Environment=MAX_TURNS_PER_SESSION=30
Environment=SESSION_MAX_SECONDS=900
Environment=MAX_UTTERANCE_MS=15000
Environment=MAX_TRANSCRIPT_CHARS=500
Environment=MAX_ANSWER_CHARS=300
Environment=LLM_MAX_TOKENS=180
Environment=UPSTREAM_MAX_ATTEMPTS=2
Environment=ASR_REQUEST_TIMEOUT_SECONDS=20
Environment=LLM_REQUEST_TIMEOUT_SECONDS=25
Environment=TTS_REQUEST_TIMEOUT_MS=30000
Environment=ASR_STAGE_TIMEOUT_SECONDS=45
Environment=LLM_STAGE_TIMEOUT_SECONDS=55
Environment=TTS_STAGE_TIMEOUT_SECONDS=65
